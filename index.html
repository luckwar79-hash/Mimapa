<!DOCTYPE html>
<html>
<head>
<title>Mi Mapa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
#map{height:80vh;width:100%}
body{font-family:sans-serif;text-align:center}
button{padding:12px 20px;font-size:16px;background:#2ea44f;color:white;border:none;border-radius:8px}
</style>
</head>
<body>
<h2>¿Dónde estoy?</h2>
<button onclick="miUbicacion()">Mostrar mi ubicación</button>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=L.map('map').setView([-12.0464,-77.0428],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
function miUbicacion(){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude;let lon=pos.coords.longitude;
map.setView([lat,lon],16);
L.marker([lat,lon]).addTo(map).bindPopup("¡Estás aquí!").openPopup();
},()=>{alert("Dale permiso de ubicación al navegador")});
}
</script>
</body>
</html>
